<div class="ask-pintu-container">
  <!-- Search Input Area -->
  <div class="input-wrapper d-flex align-items-center gap-2">
    <input 
      type="text" 
      [(ngModel)]="query" 
      (keyup.enter)="onAskPintu()"
      placeholder="Ask Pintu anything..." 
      [disabled]="loading"
      class="form-control"
    />
    <button class="ai-btn text-nowrap" (click)="onAskPintu()" [disabled]="loading || !query.trim()">
      @if(!loading) {
        <span><svg class="ai-sparkle"  viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
    <path d="M12 2L14.5 8.5L21 11L14.5 13.5L12 20L9.5 13.5L3 11L9.5 8.5L12 2Z"/>
  </svg> Ask Pintu</span>
      } @else {
        <span><svg class="ai-sparkle" style="animation: pulse-sparkle 0.7s infinite alternate ease-in-out;" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
    <path d="M12 2L14.5 8.5L21 11L14.5 13.5L12 20L9.5 13.5L3 11L9.5 8.5L12 2Z"/>
  </svg> Pintu is thinking..</span>
      }
      
    </button>
  </div>

  <!-- Dynamic Response Card (Shown ONLY when res exists) -->
  <div class="response-container" *ngIf="apiResponseHtml">
    <div class="response-card">
      <div class="response-header">
        <span class="text-primary">Result by <svg class="ai-sparkle" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
    <path d="M12 2L14.5 8.5L21 11L14.5 13.5L12 20L9.5 13.5L3 11L9.5 8.5L12 2Z"/>
  </svg> Pintu AI!</span>
        <button class="close-btn" (click)="clearResponse()"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#B7B7B7"><path d="m336-280 144-144 144 144 56-56-144-144 144-144-56-56-144 144-144-144-56 56 144 144-144 144 56 56ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg></button>
      </div>
      
      <!-- Inner HTML Binding -->
       <!-- <small class="m-2 text-primary">Query: {{querySaved}}</small> -->
      <div class="html-content" [innerHTML]="apiResponseHtml"></div>
    </div>
  </div>
  <!-- <small class="text-muted text-center" style="font-size: 10px">Note: The response is generated by AI and may not always be accurate. Please verify the information before taking any action.</small> -->
</div>
