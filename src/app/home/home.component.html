<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0 fw-bold">Dashboard</h4>
  <div class="d-flex align-items-center gap-3">
    @if (isDataLoading) {
      <div class="spinner-grow fs-6 text-success" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
    }
    <button class="ai-btn" (click)="askPintu()">
  <svg class="ai-sparkle" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
    <path d="M12 2L14.5 8.5L21 11L14.5 13.5L12 20L9.5 13.5L3 11L9.5 8.5L12 2Z"/>
  </svg>
  <span>Ask Pintu</span>
</button>

    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-date-picker">
      <mat-label>Date Range</mat-label>
      <mat-date-range-input [rangePicker]="picker" [max]="maxDate">
        <input matStartDate placeholder="Start date" [(ngModel)]="startDate">
        <input matEndDate placeholder="End date" [(ngModel)]="endDate" (ngModelChange)="onDateChange($event)">
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>
  </div>
</div>
<!-- loading added -->
@if (!isLoading) {
  <div>
    <div class="row g-1 mt-2">
      <div class="col-4">
        <div class="card h-100">
          <google-chart
            [title]="servicesChart.title"
            [type]="servicesChart.type"
            [data]="servicesChart.data"
            [options]="servicesChart.options"   
            [height]="200">   
          </google-chart>
        </div>
      </div>
      <div class="col-4">
        <div class="card h-100">
          <google-chart
            [title]="chart.title"
            [type]="chart.type"
            [data]="chart.data"
            [options]="chart.options"   
            [height]="200">   
          </google-chart>
        </div>
      </div>
      <div class="col-4">
        <div class="card h-100">
          <google-chart
            [title]="salesChart.title"
            [type]="salesChart.type"
            [data]="salesChart.data"
            [options]="salesChart.options"   
            [height]="200">   
          </google-chart>
        </div>
      </div>
    </div>
    <div class="row g-1 mt-2">
      <div class="col-8">
        <div class="card h-100">
          <google-chart
            [type]="lineChart.type"
            [data]="lineChart.data"
            [options]="lineChart.options"
            [height]="200">
          </google-chart>
        </div>
      </div>
      <div class="col-4">
        <div class="card h-100 d-flex flex-column">
          <small class="p-2 d-flex align-items-baseline border-bottom">
            <div class="indicator me-1"></div>
            <span class="fw-semibold text-muted" style="font-size: 0.8rem;">Live Metrics</span>
          </small>
          <div class="p-3 d-flex flex-column justify-content-center gap-2 flex-grow-1">
            <div class="metric-row">
              <span class="metric-label">Total Orders</span>
              <span class="metric-val text-primary">{{homeData.totalOrders ?? 0}}</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">Total Sales</span>
              <span class="metric-val text-success">&#8377;{{homeData.totalSales ?? 0}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
} @else {
  <app-loader></app-loader>
}
